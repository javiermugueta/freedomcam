name: FreedomCam
options:
  bundleIdPrefix: com.jmugueta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FreedomCam:
    type: application
    platform: iOS
    sources:
      - path: FreedomCam
        excludes:
          - Demo
      - path: FreedomCam/Demo
        type: folder
        buildPhase: resources
    info:
      path: FreedomCam/Info.plist
      properties:
        CFBundleDisplayName: freedomCam
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: To scan the QR code that connects the app with your bucket.
        CFBundleURLTypes:
          - CFBundleURLName: com.jmugueta.freedomcam
            CFBundleURLSchemes:
              - freedomcam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmugueta.freedomcam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  FreedomCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FreedomCamTests
    dependencies:
      - target: FreedomCam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FreedomCam:
    build:
      targets:
        FreedomCam: all
        FreedomCamTests: [test]
    test:
      targets:
        - FreedomCamTests
